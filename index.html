<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>La Nutria App</title>
<meta name="description" content="Los gastos de casa, la lista de compras y las tareas, en un solo lugar.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E9EDE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12160F" media="(prefers-color-scheme: dark)">

<!-- iOS: sin esto la app abre en Safari con su barra en vez de a pantalla completa -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nutria">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="envoltura">
  <header class="cabecera" id="cabecera"></header>
  <main id="vista"></main>
</div>

<button class="flotante" id="flotante" aria-label="Nuevo gasto" hidden></button>

<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>

<div class="fondo-hoja" id="fondo-hoja"></div>
<section class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo"></section>

<div class="brindis" id="brindis" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
